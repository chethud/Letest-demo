    <circle cx="138" cy="50" r="3" fill="#D9B66E"/>
    <circle cx="182" cy="50" r="3" fill="#D9B66E"/>
    <circle cx="118" cy="62" r="3" fill="#D9B66E"/>
    <circle cx="202" cy="62" r="3" fill="#D9B66E"/>
    <circle cx="98" cy="80" r="3" fill="#D9B66E"/>
    <circle cx="222" cy="80" r="3" fill="#D9B66E"/>
    <circle cx="80" cy="104" r="3" fill="#D9B66E"/>
    <circle cx="240" cy="104" r="3" fill="#D9B66E"/>
    <circle cx="68" cy="132" r="3" fill="#D9B66E"/>
    <circle cx="252" cy="132" r="3" fill="#D9B66E"/>
    <circle cx="64" cy="164" r="3" fill="#D9B66E"/>
