    <!-- Left Curved Hooked Beak -->
    <path d="M124 92 C116 92 108 96 104 102 C108 105 114 106 120 104 C116 108 114 112 114 116 C120 114 124 110 126 106 Z" fill="url(#goldGleam)"/>
    <!-- Left Alert Eye -->
