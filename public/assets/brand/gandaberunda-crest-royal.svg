    <!-- Left Talon -->
    <path d="M148 202 C142 206 136 214 132 222 C136 222 142 218 146 214 C144 220 142 226 140 230 C146 226 150 220 152 214 C152 220 154 224 156 228 C158 222 158 214 156 208 Z" fill="url(#goldGleam)"/>
    <!-- Right Talon -->
    <path d="M172 202 C178 206 184 214 188 222 C184 222 178 218 174 214 C176 220 178 226 180 230 C174 226 170 220 168 214 C168 220 166 224 164 228 C162 222 162 214 164 208 Z" fill="url(#goldGleam)"/>

    <!-- 7. LOWER FAN TAIL FEATHERS (ROYAL PEACOCK/EAGLE FLOURISH) -->
    <path d="M160 206 C156 216 150 228 142 238 C148 238 154 232 158 226 C158 236 156 248 152 258 C158 252 160 242 160 234 C160 242 162 252 168 258 C164 248 162 236 162 226 C166 232 172 238 178 238 C170 228 164 216 160 206 Z" fill="url(#goldLinear)"/>

    <!-- 8. PEDESTAL BASE (LOTUS / MAKARA MOTIF) -->
    <path d="M130 252 C140 248 150 246 160 246 C170 246 180 248 190 252 C182 256 172 258 160 258 C148 258 138 256 130 252 Z" fill="url(#goldGleam)"/>
    <path d="M120 258 C134 266 146 270 160 270 C174 270 186 266 200 258 C186 264 174 266 160 266 C146 266 134 264 120 258 Z" fill="url(#goldLinear)"/>
    <circle cx="160" cy="262" r="2.5" fill="#E8CD8C"/>
    <circle cx="144" cy="258" r="2" fill="#D9B66E"/>
    <circle cx="176" cy="258" r="2" fill="#D9B66E"/>
  </g>
</svg>
