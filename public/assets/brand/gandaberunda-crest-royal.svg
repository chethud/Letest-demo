    <path d="M242 78 C258 88 268 108 266 126 C262 118 256 114 248 116 C256 126 258 140 252 152 C248 142 240 138 232 140 C240 152 238 168 230 178 C226 168 218 164 210 166" stroke="url(#goldGleam)" stroke-width="2" stroke-linecap="round" fill="none"/>

