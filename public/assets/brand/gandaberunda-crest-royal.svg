    <path d="M152 148 Q160 154 168 148 M150 160 Q160 168 170 160 M152 172 Q160 180 168 172 M154 184 Q160 190 166 184" stroke="url(#goldGleam)" stroke-width="2" stroke-linecap="round" fill="none"/>

