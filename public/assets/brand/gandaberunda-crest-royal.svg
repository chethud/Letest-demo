    <!-- Left Arch Side -->
    <path d="M160 34 C132 36 102 46 80 66 C60 85 46 112 44 140 C42 166 52 192 68 212 C82 229 102 240 124 246 C112 242 96 230 84 216 C70 198 62 176 64 152 C66 128 78 104 96 86 C114 68 136 56 160 54 Z" fill="url(#goldLinear)" opacity="0.95"/>
    <!-- Right Arch Side -->
