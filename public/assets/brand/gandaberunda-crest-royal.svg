<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="100%" height="100%" fill="none">
  <!-- Gradients for Royal Antique Mysore Gold -->
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="40%" stop-color="#8C6934"/>
      <stop offset="70%" stop-color="#AA8444"/>
      <stop offset="100%" stop-color="#6B5024"/>
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7B5B28"/>
      <stop offset="50%" stop-color="#D9B66E"/>
      <stop offset="100%" stop-color="#7B5B28"/>
    </linearGradient>
    <filter id="goldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3A2810" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#goldShadow)">
