    <path d="M140 115 C146 122 154 124 160 124 C166 124 174 122 180 115 C176 128 172 136 160 138 C148 136 144 128 140 115 Z" fill="url(#goldGleam)"/>
    <!-- Royal Necklace Jewels -->
    <circle cx="148" cy="122" r="2" fill="#FFFFFF"/>
    <circle cx="160" cy="125" r="2.5" fill="#E8CD8C"/>
    <circle cx="172" cy="122" r="2" fill="#FFFFFF"/>

    <!-- 4. MAJESTIC EXPANDED WINGS (SPREAD SYMMETRICALLY) -->
    
    <!-- LEFT WING - Layer 1 (Upper Primary Pinions) -->
    <path d="M142 126 C124 120 102 114 84 118 C78 120 74 126 78 130 C86 132 98 130 112 132 C96 136 86 142 88 148 C94 150 104 146 116 144 C100 152 94 160 98 166 C104 168 116 160 126 156 C112 168 110 178 116 182 C122 182 132 172 138 164 C132 176 134 186 140 188 C146 186 152 174 154 162 Z" fill="url(#goldLinear)"/>
    
